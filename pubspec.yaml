name: zh_en_dict
description: "Chinese-English dictionary, flashcards and grammar study app."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Text-to-speech for Chinese pronunciation
  flutter_tts: ^4.2.2
  # Simple state management
  provider: ^6.1.2
  # Persist flashcard study progress locally
  shared_preferences: ^2.3.3
  home_widget: ^0.9.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/data/words.json
    - assets/data/grammar.json

  fonts:
    - family: NotoSansSC
      fonts:
        - asset: assets/fonts/NotoSansSC-Subset.ttf
